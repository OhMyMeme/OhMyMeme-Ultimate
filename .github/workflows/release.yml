name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  TAG: ${{ github.ref_name }}
  IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:web

      - name: Assemble release folder
        working-directory: nuxt-app
        run: |
          mkdir -p dist/ohmymeme-ultimate
          cp -r .output dist/ohmymeme-ultimate/.output
          cp release/start.mjs dist/ohmymeme-ultimate/
          cp release/start.bat dist/ohmymeme-ultimate/
          cp release/start.sh dist/ohmymeme-ultimate/
          cp release/README.txt dist/ohmymeme-ultimate/README.txt
          cp .env.example dist/ohmymeme-ultimate/.env.example
          chmod +x dist/ohmymeme-ultimate/start.sh

      - name: Create archives
        working-directory: nuxt-app/dist
        run: |
          tar -czf "ohmymeme-ultimate-${TAG}.tar.gz" ohmymeme-ultimate
          python3 -c "import shutil; shutil.make_archive('ohmymeme-ultimate-${TAG}', 'zip', '.', 'ohmymeme-ultimate')"

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            nuxt-app/dist/*.tar.gz
            nuxt-app/dist/*.zip
          if-no-files-found: error

  build-desktop:
    name: Build Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        working-directory: tauri-app
        run: npm run tauri build

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: |
            tauri-app/src-tauri/target/release/desktop.exe
            tauri-app/src-tauri/target/release/bundle/msi/*.msi
            tauri-app/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build-web, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: ${{ env.IS_PRERELEASE == 'false' }}
          files: |
            dist/*.tar.gz
            dist/*.msi
            dist/*.exe
