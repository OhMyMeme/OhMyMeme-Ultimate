name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  TAG: ${{ github.ref_name }}
  IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}

jobs:
  build-server:
    name: Build Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # CI（ubuntu）有网络，在线构建即可；本地 Windows 无 TLS 时才用 vendor 离线构建
      # （rust-server/.cargo/config.toml 把 crates-io 替换为本地 vendor 目录，vendor 不入库，
      #   故 CI 上必须先移除该配置，否则 cargo 会尝试从 checkout 中不存在的 vendor 拉依赖）
      - name: Build server (release)
        working-directory: rust-server
        run: |
          rm -f .cargo/config.toml
          cargo build --release

      - name: Assemble release folder
        working-directory: rust-server
        run: |
          mkdir -p dist/ohmymeme-ultimate
          cp target/release/ohmymeme-server dist/ohmymeme-ultimate/ohmymeme-server
          cp scripts/start.sh dist/ohmymeme-ultimate/start.sh
          cp scripts/start.bat dist/ohmymeme-ultimate/start.bat
          cp scripts/README.txt dist/ohmymeme-ultimate/README.txt
          cp .env.example dist/ohmymeme-ultimate/.env.example
          chmod +x dist/ohmymeme-ultimate/start.sh

      - name: Create archives
        working-directory: rust-server/dist
        run: |
          tar -czf "ohmymeme-ultimate-${TAG}.tar.gz" ohmymeme-ultimate
          python3 -c "import shutil; shutil.make_archive('ohmymeme-ultimate-${TAG}', 'zip', '.', 'ohmymeme-ultimate')"

      - name: Stage server release files
        working-directory: rust-server
        run: |
          mkdir -p ../dist-staging
          cp target/release/ohmymeme-server ../dist-staging/ohmymeme-server
          cp dist/*.tar.gz dist/*.zip ../dist-staging/

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: dist-staging/
          if-no-files-found: error

  build-desktop:
    name: Build Desktop
    runs-on: windows-latest
    env:
      # 自动更新签名私钥（tauri build 的 createUpdaterArtifacts 与 signer sign 均会读取）
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        working-directory: tauri-app
        run: npm run tauri build

      - name: Sign installer and generate update manifest
        shell: pwsh
        working-directory: tauri-app
        run: |
          # 定位 NSIS 安装包（形如 OhMyMeme_<version>_x64-setup.exe，productName 来自 tauri.conf.json）
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "未找到 NSIS 安装包" }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "缺少 secrets.TAURI_SIGNING_PRIVATE_KEY" }
          $installerPath = $installer.FullName

          # 私钥与密码已由 job 级 env 注入（TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD），
          # signer sign 会自动读取；stdout 含提示行/说明行，只取 base64 签名行
          $sig = ((npx --no-install tauri signer sign $installerPath 2>$null | Where-Object { $_ -match '^[A-Za-z0-9+/]+={0,2}$' }) | Out-String).Trim()
          if (-not $sig) { throw "tauri signer sign 未输出签名" }

          $tauriConfig = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = $tauriConfig.version
          $exeName = $installer.Name
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$exeName"

          node scripts/make-update-manifest.mjs `
            --version $version `
            --installer $installerPath `
            --signature $sig `
            --url $url `
            --notes "OhMyMeme ${version} release" `
            --out latest.json

      - name: Stage desktop release files
        working-directory: tauri-app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ..\dist-staging | Out-Null
          Copy-Item -Path "src-tauri/target/release/bundle/nsis/*-setup.exe" -Destination ..\dist-staging\
          Copy-Item -Path "latest.json" -Destination ..\dist-staging\

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: dist-staging/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build-server, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: release/server

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-dist
          path: release/desktop

      - name: List downloaded files
        run: find release -type f

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: ${{ env.IS_PRERELEASE == 'false' }}
          files: |
            release/server/ohmymeme-server
            release/server/*.tar.gz
            release/server/*.zip
            release/desktop/*-setup.exe
            release/desktop/latest.json
