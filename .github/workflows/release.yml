name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:web

      - name: Assemble release folder
        working-directory: nuxt-app
        run: |
          mkdir -p dist/ohmymeme-ultimate
          cp -r .output dist/ohmymeme-ultimate/.output
          cp release/start.mjs dist/ohmymeme-ultimate/
          cp release/start.bat dist/ohmymeme-ultimate/
          cp release/start.sh dist/ohmymeme-ultimate/
          cp release/README.txt dist/ohmymeme-ultimate/README.txt
          cp .env.example dist/ohmymeme-ultimate/.env.example
          chmod +x dist/ohmymeme-ultimate/start.sh

      - name: Create archives
        working-directory: nuxt-app/dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf "ohmymeme-ultimate-${TAG}.tar.gz" ohmymeme-ultimate
          python3 -c "import shutil; shutil.make_archive('ohmymeme-ultimate-${TAG}', 'zip', '.', 'ohmymeme-ultimate')"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            nuxt-app/dist/*.tar.gz
            nuxt-app/dist/*.zip
