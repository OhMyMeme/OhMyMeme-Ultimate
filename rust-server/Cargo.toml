[package]
name = "ohmymeme-server"
version = "0.1.0"
edition = "2021"
description = "OhMyMeme-Ultimate Rust backend (axum + MongoDB), API-compatible with the original Nitro server"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
mongodb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
futures-util = "0.3"
dotenvy = "0.15"

[profile.release]
opt-level = 3
