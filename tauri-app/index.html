<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/tauri.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=open+sans:400,500,600,700&family=poppins:500,600,700" rel="stylesheet" />
  <title>OhMyMemeUltimate Desktop</title>
  <style>
    :root { --ohmymeme-bg: #ffffff; }
    .dark { --ohmymeme-bg: #0f172a; }
    html { background-color: var(--ohmymeme-bg); }
  </style>
  <script>
    (function () {
      var mode = localStorage.getItem("vueuse-color-scheme") || "auto"
      var dark = mode === "dark" || (mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches)
      var neutral = localStorage.getItem("ohmymeme_theme_neutral") || "slate"
      var NEUTRAL = {
        slate:  { light: '#f8fafc', dark: '#020617' },
        gray:   { light: '#f9fafb', dark: '#030712' },
        zinc:   { light: '#fafafa', dark: '#09090b' },
        neutral:{ light: '#fafafa', dark: '#0a0a0a' },
        stone:  { light: '#fafaf9', dark: '#0c0a09' }
      }
      var colors = NEUTRAL[neutral] || NEUTRAL.slate
      if (dark) {
        document.documentElement.classList.add("dark")
        document.documentElement.style.setProperty('--ohmymeme-bg', colors.dark)
        document.querySelector("meta[name='theme-color']").setAttribute("content", colors.dark)
      } else {
        document.documentElement.style.setProperty('--ohmymeme-bg', colors.light)
        document.querySelector("meta[name='theme-color']").setAttribute("content", colors.light)
      }
    })()
  </script>
</head>

<body>
  <div id="app" class="isolate"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
